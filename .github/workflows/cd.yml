# Workflow de Integração Contínua focado exclusivamente na execução
# de testes unitários, com estrutura preparada para futuras expansões.

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: "24"
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: velo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: velo/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit tests
        run: yarn test --run
        
  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url}}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Remote preview build applies velo/vercel.json rewrites.
      # VITE_* are passed with --build-env because the Vercel dashboard cannot
      # store a second VITE_SUPABASE_URL for Preview (ghost "branch undefined").
      - name: Deploy Preview
        id: deploy
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL_PREVIEW }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID_PREVIEW }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY_PREVIEW }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure GitHub secrets VITE_SUPABASE_URL_PREVIEW and VITE_SUPABASE_PUBLISHABLE_KEY_PREVIEW"
            exit 1
          fi
          URL=$(vercel deploy --yes --target=preview --token="$VERCEL_TOKEN" \
            --build-env "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" \
            --build-env "VITE_SUPABASE_PROJECT_ID=$VITE_SUPABASE_PROJECT_ID" \
            --build-env "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY")
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"

  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: velo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: velo/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
      
      - name: Install Playwright Browser
        run: yarn playwright install --with-deps chromium

      - name: Run E2E Regression Tests
        run: |
          if [ -n "$DATABASE_URL" ]; then
            yarn playwright test
          else
            echo "::warning::DATABASE_URL secret not configured — skipping @db tests"
            yarn playwright test --grep-invert @db
          fi
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
          TESTDINO_SERVER_URL: https://reporter.testdino.com

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: velo/playwright-report/

  deploy-production:
    name: Deploy Production
    needs: [build-and-deploy, e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Fresh production build (not vercel promote) so the bundle gets Production VITE_SUPABASE_*.
      - name: Deploy Production
        run: vercel deploy --yes --prod --token=$VERCEL_TOKEN
